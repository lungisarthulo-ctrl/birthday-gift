<!DOCTYPE html>
<head>
<meta charset = "utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vid</title>
</head>
<style>
  html {
    height: 100%;
    margin: 0; 
    background: black;
  }
  body{
    height: 100%;
    margin: 0;
    display: flex;
    justify-content: center; 
    align-items: center;
  }
  /* ========================= */
/* MOBILE RESPONSIVE FIX */
/* ========================= */
@media (max-width: 768px) {

  body {
    padding: 20px;
  }

  .layout {
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .left img {
    width: 100%;
    max-width: 350px;
  }

  .right {
    max-width: 100%;
    text-align: center;
  }

  .right h1 {
    font-size: 40px;
  }

  .right p {
    font-size: 16px;
  }

  .image-box {
    height: 200px;
  }

  .navbar {
    padding: 0 20px;
  }

  .nav-links {
    gap: 15px;
  }

}

</style>
<html>
<body>

  <video id="myVideo" width="80%" controls autoplay>
    <source src="Video4.mp4" type="video/mp4">
  </video>

  <script>
  // Listen for a click anywhere on the page at any time
  window.addEventListener('click', function() {
    // Go back to the previous page in history
    window.history.back(); 
  }, { once: true }); // { once: true } ensures the code only runs once

  // Optional: If the video actually ends without a click, go back automatically
  const video = document.getElementById('myVideo');
  if (video) {
    video.onended = function() {
      window.history.back();
    };
  }
</script>


</body>
</html>
